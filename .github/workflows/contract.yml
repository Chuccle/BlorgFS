name: Contract

# The driver's half of the wire contract it shares with server-rs
# (third_party/schemas/contract.json). The checks themselves are sandbox
# tests (tests/sandbox/ContractTest.cpp), which build.yml already runs as
# part of ClientSandbox, and a guest suite (tests/guest-suites/Contract.ps1)
# with its corpus (tests/guest-suites/Contract.corpus).
# This workflow makes sure they keep up with the contract: every behaviour
# the driver is responsible for needs a tagged sandbox test, and the guest
# suite has to parse under the Windows PowerShell 5.1 the guest runs.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  traceability:
    name: Every driver behaviour has a sandbox test
    runs-on: ubuntu-latest
    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      run: echo "is_dependabot=${{ github.actor == 'dependabot[bot]' }}" >> $GITHUB_OUTPUT

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}

    - name: Check out the pinned contract
      run: git submodule update --init third_party/schemas

    # Against the contract this commit pins, so a schemas bump that adds a
    # behaviour fails here until the driver has a test for it.
    - name: Check sandbox tests cover the driver's behaviours
      run: python3 third_party/schemas/tools/check_traceability.py --checker BlorgFS --root tests/sandbox

    - name: Check the guest suite covers the guest's behaviours
      run: python3 third_party/schemas/tools/check_traceability.py --checker guest --root tests/guest-suites --root third_party/schemas/conformance

    # The host serves Contract.corpus as-is, so it has to stay exactly what
    # the pinned probe seeds; a probe change that reshapes its tree fails here.
    - name: Check the contract corpus is what the probe seeds
      shell: pwsh
      run: |
        $seed = Join-Path $env:RUNNER_TEMP 'seed'
        ./third_party/schemas/conformance/Test-BlorgContract.ps1 -Server unused:0 -SeedRoot $seed -ProbeDir Contract.corpus -SeedOnly
        git diff --no-index --stat -- (Join-Path $seed 'Contract.corpus') tests/guest-suites/Contract.corpus
        if ($LASTEXITCODE -ne 0) { Write-Host '::error::tests/guest-suites/Contract.corpus differs from what the probe seeds; regenerate it with -SeedOnly'; exit 1 }

  guest-suite-syntax:
    name: Guest suite parses on Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Parse with Windows PowerShell 5.1
      shell: powershell
      run: |
        $failed = $false
        foreach ($script in Get-ChildItem tests\guest-suites -Filter *.ps1) {
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
          foreach ($e in @($errors)) { if ($e) { Write-Host "::error file=$($script.Name)::$e"; $failed = $true } }
        }
        if ($failed) { exit 1 }
        Write-Host "Parsed under PowerShell $($PSVersionTable.PSVersion)"
