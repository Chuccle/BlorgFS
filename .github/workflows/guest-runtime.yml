name: Guest runtime tests

# Loads the packaged driver into a real Windows kernel and tests it against
# the packaged server. The Windows guest runs under KVM/QEMU on a Linux
# runner, driven by ci/guest/ -- the same scripts run on any KVM host, so a
# red run here reproduces on any Linux machine with KVM with
#   ci/guest/run-guest-tests.sh --package <unpacked artifact>
# See ci/guest/README.md.
#
# A fixed test: the package from build.yml (never a build of its own, so
# what is tested is exactly what ships), a golden image built from pinned
# inputs, and the suites in the repo. Nothing here takes commands from
# outside the commit; acting in the guest by hand is guest-session.yml.

on:
  # Every successful build, on any branch or PR, gets a guest run against
  # the package it just produced.
  workflow_run:
    workflows: [ "Build BlorgFS" ]
    types: [ completed ]
  # Changes to the rig itself are tested by the rig.
  pull_request:
    branches: [ master ]
    paths:
      - 'ci/guest/**'
      - 'tools/Test-BlorgCorrectness.ps1'
      - 'tests/guest-suites/**'
      - '.github/workflows/guest-runtime.yml'
  workflow_dispatch:
    inputs:
      package_run_id:
        description: 'Build BlorgFS run to take the package from (default: newest with one)'
        required: false
        default: ''
      verifier:
        description: 'Driver Verifier on BlorgFS.sys'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# Queued, not cancelled: a cancelled first-of-the-quarter image build is
# 30 minutes thrown away and never cached.
concurrency:
  group: guest-runtime-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  guest:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    name: Windows guest (KVM)
    outputs:
      package-run: ${{ steps.host.outputs.run-id }}
      dumps: ${{ steps.dumps.outputs.found }}
    env:
      GUEST_HOME: /mnt/blorgfs-guest
      PACKAGE_ARTIFACT: blorg-package-windows-x64
      # A workflow_run job runs with the default branch's cache scope, even
      # when the build that triggered it was a pull request -- possibly
      # from a fork. Such a run must neither execute that PR's rig scripts
      # nor save a golden image master would later boot. Its package (the
      # thing under test) still comes from the PR. pull_request runs are
      # fine either way: their caches are scoped to the PR.
      UNTRUSTED_TRIGGER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' }}

    steps:
    # The rig's scripts from the same commit as the package under test,
    # except for a PR-triggered workflow_run, which uses the default
    # branch's (see UNTRUSTED_TRIGGER).
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') && github.event.repository.default_branch || github.event.workflow_run.head_sha || github.sha }}
        persist-credentials: false

    # Only for the contract probe (third_party/schemas/conformance), which
    # tests/guest-suites/Contract.ps1 runs in the guest. No credentials on
    # purpose: this job runs PR code. If the submodule cannot be fetched
    # anonymously, the Contract suite fails saying the probe is missing.
    - name: Check out the schemas submodule
      continue-on-error: true
      run: git submodule update --init third_party/schemas

    - name: Set up the KVM host
      id: host
      uses: ./ci/guest
      with:
        # Until build.yml's package job (#63) is on master, a rig PR has no
        # package of its own: pin #63's build. Remove once #63 is merged.
        package-run-id: ${{ github.event.workflow_run.id || inputs.package_run_id || (github.event_name == 'pull_request' && '37157505659') || '' }}
        save-image: ${{ env.UNTRUSTED_TRIGGER != 'true' }}

    - name: Run the tests in the guest
      if: steps.host.outputs.found == 'true'
      run: |
        args=(--package package --out guest-results)
        # A rig change also checks every way of acting in the guest, with
        # the fixed probe script in the repo, so it keeps the guest up.
        [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] && args+=(--keep)
        [[ "${{ inputs.verifier }}" == "false" ]] && args+=(--no-verifier)
        # Contract and behavioural suites, when the repo carries them.
        [[ -d tests/guest-suites ]] && args+=(--suites tests/guest-suites)
        ci/guest/run-guest-tests.sh "${args[@]}"

    - name: Check the guestctl channels
      if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.host.outputs.found == 'true' }}
      run: ci/guest/run-session.sh --out guest-results ci/guest/session-probe.sh

    - name: Power off the guest
      if: always() && github.event_name == 'pull_request' && steps.host.outputs.found == 'true'
      run: ci/guest/host/guestctl down || true

    - name: Look for crash dumps
      id: dumps
      if: always() && steps.host.outputs.found == 'true'
      run: |
        if compgen -G 'guest-results/results/diag/dumps/*.dmp' >/dev/null; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload results
      if: always() && steps.host.outputs.found == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: guest-results
        path: guest-results/
        if-no-files-found: warn

    - name: Upload the image build's screens
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: guest-image-build
        path: |
          ${{ env.GUEST_HOME }}/image/build/install/screens/
          ${{ env.GUEST_HOME }}/image/build/install/qemu.log
        if-no-files-found: ignore

  # A bugcheck's dumps are analysed on Windows, where the debugger is: the
  # verdict, faulting module and stack go to the log and to a
  # "blorg guest-crash" annotation. The driver's PDB comes from the same
  # Build BlorgFS run as the package.
  crash:
    needs: guest
    if: always() && needs.guest.outputs.dumps == 'true'
    runs-on: windows-latest
    name: Analyse the guest's crash dumps
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') && github.event.repository.default_branch || github.event.workflow_run.head_sha || github.sha }}
        persist-credentials: false

    - name: Download the guest results
      uses: actions/download-artifact@v5
      with:
        name: guest-results
        path: guest-results

    - name: Download the driver's symbols
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download "${{ needs.guest.outputs.package-run }}" -R "${{ github.repository }}" -n BlorgFS-Release-x64 -D symbols

    - name: Analyse
      shell: pwsh
      run: ci/guest/Show-CrashAnalysis.ps1 -ResultsDir guest-results -SymbolDir symbols
