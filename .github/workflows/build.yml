name: Build BlorgFS

on:
  push:
    branches: [ master ]
    # A v* tag builds the same package and publishes it as a release; the
    # tag must match VERSION (checked in the package job).
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  # Dispatchable so other tooling builds the package through this workflow
  # rather than a copy of it. Dispatch with the BlorgFS ref to build (the
  # API's own `ref`); server-rs always comes from that ref's pin. Pass a
  # unique `correlation_id` to find the run again: it goes in the run name.
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Opaque caller id, echoed into the run name
        required: false
        default: ''

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build BlorgFS {0} {1}', github.ref_name, inputs.correlation_id) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

permissions:
  contents: read
  packages: read
  actions: read

env:
  SOLUTION_NAME: BlorgFS.sln
  ChocolateyUseWindowsCompression: 'true'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Release, Debug]
        platform: [x64]
    name: Build ${{ matrix.config }} ${{ matrix.platform }}

    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      shell: pwsh
      run: echo "is_dependabot=${{ github.actor == 'dependabot[bot]' }}" >> $env:GITHUB_OUTPUT

    - name: Checkout repository and submodules
      uses: actions/checkout@v6
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}
        submodules: recursive

    - name: Get flatcc commit hash
      id: flatcc_hash
      shell: pwsh
      run: |
        cd third_party/flatcc
        $hash = git rev-parse HEAD
        Write-Host "FlatCC Hash: $hash"
        echo "flatcc_hash=$hash" >> $env:GITHUB_OUTPUT
        cd ..

    - name: Cache Flatcc build
      id: cache_flatcc
      uses: actions/cache@v5
      with:
        path: |
          third_party/flatcc/bin/Release
          third_party/flatcc/build/MSVC
        key: ${{ runner.os }}-flatcc-${{ steps.flatcc_hash.outputs.flatcc_hash }}

    - name: Install build tools
      if: steps.cache_flatcc.outputs.cache-hit != 'true'
      shell: pwsh
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

    # pwsh, not cmd: a multi-line `shell: cmd` step reports only the LAST
    # command's exit code, so `cd ..\..\..` at the end returned 0 and hid a
    # failed cmake configure entirely. The build then died three steps later
    # on a missing generated header, which points nowhere near the cause.
    #
    # No -G: the generator was pinned to "Visual Studio 17 2022" and the
    # windows-latest image moved to Visual Studio 18, so cmake reported
    # "could not find any instance of Visual Studio" and (because of the
    # above) nothing noticed. Letting cmake pick the newest installed
    # generator is what makes this survive the next image bump too.
    - name: Build flatcc compiler
      if: steps.cache_flatcc.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path third_party\flatcc\build\MSVC | Out-Null
          Push-Location third_party\flatcc\build\MSVC
          try {
            # Quoted: unquoted, PowerShell hands cmake a truncated "3" and it
            # rejects the value outright. The flag itself is needed because
            # flatcc's cmake_minimum_required predates what CMake 4 accepts.
            cmake '-DCMAKE_POLICY_VERSION_MINIMUM=3.5' ..\..
            if ($LASTEXITCODE -ne 0) { throw "cmake configure failed with exit code $LASTEXITCODE" }

            cmake --build . --config Release
            if ($LASTEXITCODE -ne 0) { throw "cmake build failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

    # Both inputs are hard requirements -- Client.c includes the generated
    # reader unconditionally. This previously echoed "skipping" and exited 0
    # when either was missing, which converted a clear "flatcc did not build"
    # into an unrelated-looking C1083 in the compile step.
    - name: Create generated flatbuffer files
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $flatcc = "third_party\flatcc\bin\Release\flatcc.exe"
        $schema = "third_party\schemas\metadata_flatbuffer.fbs"

        if (-not (Test-Path $flatcc))  { throw "flatcc compiler missing at $flatcc -- the flatcc build step did not produce it" }
        if (-not (Test-Path $schema))  { throw "schema missing at $schema -- is the schemas submodule checked out?" }

        New-Item -ItemType Directory -Force -Path generated | Out-Null
        & $flatcc -rv --common_reader -o generated $schema
        if ($LASTEXITCODE -ne 0) { throw "flatcc codegen failed with exit code $LASTEXITCODE" }

        $reader = "generated\metadata_flatbuffer_reader.h"
        if (-not (Test-Path $reader)) { throw "flatcc reported success but $reader was not produced" }

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ./packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Obtain WDK from Nuget
      run: nuget restore ${{ env.SOLUTION_NAME }} -PackagesDirectory ".\packages"

    - name: Build driver
      run: msbuild ${{ env.SOLUTION_NAME }} /p:Configuration=${{ matrix.config }} /p:Platform=${{ matrix.platform }} /bl # /bl creates msbuild.binlog

    # The sandbox suites compile the real driver sources against a kernel
    # model and are where most of this project's coverage actually lives --
    # IRQL and lock-order rules, the node-table pin protocol and its
    # interleavings, dispatch and IOCTL routing, client scenarios and
    # fuzzing. CI built them and then never ran them, so a
    # green tick meant only that they compiled.
    #
    # Run the binaries directly rather than tools\Invoke-BlorgChecks.ps1
    # -Tier Fast: the tier would rebuild everything the msbuild step above
    # just produced. Keep this list AND the filter below in step with that
    # script's Fast tier.
    #
    # The filter is the same one Fast applies locally. *SchedTest.* is the
    # systematic interleaving explorations and *StressTest.* the threaded
    # sampling runs; together they were 546 of the 608 seconds this step
    # used to take, and a single exhaustive proof was 518 of those. They are
    # verification runs rather than regression tests, so they belong in
    # verify.yml's nightly Proof job, which runs exactly what this excludes.
    # Dropping them from here without adding them there would have quietly
    # stopped running them.
    - name: Run sandbox test suites
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        # Located by search, not by a fixed path. A solution build drops these
        # in the repo-root $(Platform)\$(Configuration), while building the
        # projects individually (which is what tools\Invoke-BlorgChecks.ps1
        # does locally) puts them under tests\sandbox\. Hardcoding either one
        # works in exactly one of those two places.
        $searchRoots = @(
          "${{ matrix.platform }}\${{ matrix.config }}",
          "tests\sandbox\${{ matrix.platform }}\${{ matrix.config }}"
        )

        $suites = @(
          'ClientSandbox.exe',
          'ClientFuzz.exe',
          'SocketSandbox.exe',
          'NodeTableSandbox.exe',
          'DispatchSandbox.exe',
          'TlsHandshakeSandbox.exe'
        )

        $failed = @()

        foreach ($suite in $suites) {
          $path = $searchRoots |
                  ForEach-Object { Join-Path $_ $suite } |
                  Where-Object { Test-Path $_ } |
                  Select-Object -First 1

          if (-not $path) {
            throw "$suite was not built -- looked in: $($searchRoots -join ', ')"
          }

          Write-Host "--- $suite ($path) ---"
          & $path '--gtest_filter=-*SchedTest.*:*StressTest.*'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::$suite failed with exit code $LASTEXITCODE"
            $failed += $suite
          }
        }

        if ($failed.Count -gt 0) { throw "sandbox suites failed: $($failed -join ', ')" }

    - name: Run TLS unit tests
      shell: pwsh
      run: |
        $exeDir = "${{ matrix.platform }}\${{ matrix.config }}"

        Write-Host "--- TlsTest ---"
        & "$exeDir\TlsTest.exe"
        if ($LASTEXITCODE -ne 0) { throw "TlsTest failed with exit code $LASTEXITCODE" }

        Write-Host "--- TlsFuzzTest ---"
        & "$exeDir\TlsFuzzTest.exe"
        if ($LASTEXITCODE -ne 0) { throw "TlsFuzzTest failed with exit code $LASTEXITCODE" }

    # Only run once (Release leg) since it needs openssl installed and a live
    # s_server -- TlsTest/TlsFuzzTest above already run for every matrix leg.
    - name: Run TLS handshake test against openssl s_server
      if: matrix.config == 'Release'
      shell: pwsh
      run: |
        choco install openssl -y --no-progress | Out-Null

        # The runner image ships its own openssl.exe earlier on PATH than
        # anything Chocolatey adds, so Get-Command (and any hardcoded guess
        # like "OpenSSL-Win64") can silently resolve to that pre-existing,
        # unpinned build instead of the one Chocolatey just installed. Its
        # own install script (chtof/chocolatey-packages) locates the real
        # install dir the same way -- via the uninstall registry entry --
        # since the installer's target path isn't fixed across versions.
        # Mirror that lookup instead of guessing a path.
        $installLocation = Get-ItemProperty -Path @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        ) -ErrorAction SilentlyContinue |
          Where-Object { $_.DisplayName -like "OpenSSL*" } |
          Select-Object -First 1 -ExpandProperty InstallLocation

        if (-not $installLocation) { throw "Could not find OpenSSL install location in registry after choco install" }

        $opensslExe = Join-Path $installLocation "bin\openssl.exe"
        if (-not (Test-Path $opensslExe)) { throw "openssl.exe not found at resolved install location: $opensslExe" }

        Write-Host "Using openssl: $opensslExe"
        & $opensslExe version

        New-Item -ItemType Directory -Force -Path tls-test-certs | Out-Null
        & $opensslExe ecparam -name prime256v1 -genkey -noout -out tls-test-certs\key.pem
        & $opensslExe req -new -x509 -key tls-test-certs\key.pem -out tls-test-certs\cert.pem -days 1 -subj "/CN=blorgfs-ci"

        # -quiet previously hid the server's view of the handshake, so a
        # prior failure ("SSL_write:bad length") gave no way to tell what
        # ClientHello the server thought it received. Trade -quiet for
        # -msg/-debug/-state and capture stdout+stderr to a file (rather
        # than letting it interleave with the test's own async console
        # output) so a future failure is actually diagnosable.
        # No -naccept: we already tear the process down explicitly below
        # via Stop-Process, so there's no need for openssl's own
        # accept-count limit, and an unbounded accept loop is one less
        # variable while diagnosing the real issue below.
        #
        # Root cause of every prior failure: -NoNewWindow makes s_server
        # inherit THIS PowerShell process's console instead of getting its
        # own. Console control events (Ctrl+C/Break, and things the runner
        # sends as part of normal step supervision) are broadcast to every
        # process sharing a console, not just the one they're meant for.
        # openssl's accept loop has its own handler for exactly this, and
        # "shutdown accept socket" (seen in every failing run) is the exact
        # string it prints from that signal-triggered graceful-shutdown
        # path in do_accept() -- explaining ACCEPT immediately followed by
        # DONE, zero SSL_accept() calls, and zero -msg/-debug/-state trace
        # regardless of -naccept, address family, or ClientHello content:
        # the loop was told to stop before it ever serviced a client.
        # Giving it its own (hidden) window/console isolates it from that.
        # "-4"/explicit loopback stays as harmless hardening, not the fix.
        $serverLog = "tls-test-certs\s_server.log"
        $server = Start-Process -FilePath $opensslExe -ArgumentList @(
          "s_server", "-tls1_3", "-ciphersuites", "TLS_AES_128_GCM_SHA256", "-groups", "P-256",
          "-cert", "tls-test-certs\cert.pem", "-key", "tls-test-certs\key.pem",
          "-accept", "127.0.0.1:14448", "-4", "-msg", "-debug", "-state"
        ) -PassThru -WindowStyle Hidden -RedirectStandardOutput $serverLog -RedirectStandardError "$serverLog.err"

        # Poll the listen state instead of sleeping a fixed 2s: a slow runner
        # otherwise surfaces as a connection-refused flake in the client test.
        # Get-NetTCPConnection (not a probe connect) so the readiness check
        # itself doesn't consume an accept / pollute the -msg trace.
        $listenDeadline = (Get-Date).AddSeconds(15)
        $listening = $false
        while ((Get-Date) -lt $listenDeadline) {
          if ($server.HasExited) { break }
          if (Get-NetTCPConnection -State Listen -LocalPort 14448 -ErrorAction SilentlyContinue) {
            $listening = $true
            break
          }
          Start-Sleep -Milliseconds 250
        }
        if (-not $listening) {
          Write-Host "--- s_server stdout ---"
          Get-Content $serverLog -ErrorAction SilentlyContinue | Write-Host
          Write-Host "--- s_server stderr ---"
          Get-Content "$serverLog.err" -ErrorAction SilentlyContinue | Write-Host
          throw "s_server never started listening on 14448 (exited: $($server.HasExited))"
        }

        try {
          Write-Host "--- TlsHandshakeTest ---"
          & "${{ matrix.platform }}\${{ matrix.config }}\TlsHandshakeTest.exe"
          if ($LASTEXITCODE -ne 0) { throw "TlsHandshakeTest failed with exit code $LASTEXITCODE" }
        } finally {
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          Write-Host "--- s_server stdout ---"
          Get-Content $serverLog -ErrorAction SilentlyContinue | Write-Host
          Write-Host "--- s_server stderr ---"
          Get-Content "$serverLog.err" -ErrorAction SilentlyContinue | Write-Host
        }

    # BlorgFS/ is the staged driver package (stamped INF + catalog); the
    # package job below needs it, since only that INF matches the catalog.
    # The binlog's comment used to sit on its path line, inside the block
    # scalar, so the pattern never matched and the log was never uploaded.
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: BlorgFS-${{ matrix.config }}-${{ matrix.platform }}
        path: |
          ${{ github.workspace }}/${{ matrix.platform }}/${{ matrix.config }}/BlorgFS.*
          ${{ github.workspace }}/${{ matrix.platform }}/${{ matrix.config }}/*.inf
          ${{ github.workspace }}/${{ matrix.platform }}/${{ matrix.config }}/*.cat
          ${{ github.workspace }}/${{ matrix.platform }}/${{ matrix.config }}/BlorgFS/
          ${{ github.workspace }}/msbuild.binlog
        if-no-files-found: warn
  # The combined package: this driver plus the server-rs commit pinned at
  # third_party/server-rs, versioned together. See "Packaging" in AGENTS.md.
  #
  # pins is cheap and runs on Linux so a schema skew between the two fails in
  # seconds, before either Windows build has finished.
  pins:
    runs-on: ubuntu-latest
    name: Package pins

    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      shell: pwsh
      run: echo "is_dependabot=${{ github.actor == 'dependabot[bot]' }}" >> $env:GITHUB_OUTPUT

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}

    # Not recursive: the check reads server-rs's schemas gitlink, it does not
    # need the schema itself or server-rs's flatbuffers checkout.
    - name: Check out the pinned server-rs
      run: git submodule update --init third_party/server-rs

    - name: Check the driver and server compile the same schema
      shell: pwsh
      run: ./tools/Test-BlorgPackagePins.ps1 | Out-Null

  server:
    runs-on: windows-latest
    name: Build server-rs (windows x64)

    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      shell: pwsh
      run: echo "is_dependabot=${{ github.actor == 'dependabot[bot]' }}" >> $env:GITHUB_OUTPUT

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}

    # Only server-rs and its own submodules (schemas, flatbuffers); the
    # driver's third_party is not needed here.
    - name: Check out the pinned server-rs
      run: git submodule update --init --recursive third_party/server-rs

    - name: Get flatbuffers commit hash
      id: flatc_hash
      shell: pwsh
      run: echo "flatc_hash=$(git -C third_party/server-rs/buildtools/flatbuffers rev-parse HEAD)" >> $env:GITHUB_OUTPUT

    - name: Cache flatc build
      id: cache_flatc
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}\flatc
        key: ${{ runner.os }}-flatc-${{ steps.flatc_hash.outputs.flatc_hash }}

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          third_party/server-rs/target/
        key: ${{ runner.os }}-server-cargo-${{ hashFiles('third_party/server-rs/Cargo.lock') }}

    # The one recipe for the server (flatc from server-rs's own submodule,
    # then cargo --locked). Anything else that builds a package should call
    # this script too, so every package's server is built the same way.
    - name: Build server-rs
      shell: pwsh
      run: ./tools/Build-BlorgServer.ps1 -FlatcDir "$env:RUNNER_TEMP\flatc" -OutDir "$env:RUNNER_TEMP\server-bin"

    - name: Upload server binary
      uses: actions/upload-artifact@v7
      with:
        name: server-rs-windows-x64
        path: ${{ runner.temp }}/server-bin/
        if-no-files-found: error

  package:
    needs: [build, server, pins]
    runs-on: windows-latest
    name: Package
    # contents: write is only exercised on a v* tag, to publish the release.
    permissions:
      contents: write
      actions: read

    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      shell: pwsh
      run: echo "is_dependabot=${{ github.actor == 'dependabot[bot]' }}" >> $env:GITHUB_OUTPUT

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}

    - name: Check out the pinned server-rs
      run: git submodule update --init third_party/server-rs

    # Restores x64\Release\... exactly as the build job left it.
    - name: Download driver build
      uses: actions/download-artifact@v5
      with:
        name: BlorgFS-Release-x64
        path: ${{ github.workspace }}

    - name: Download server build
      uses: actions/download-artifact@v5
      with:
        name: server-rs-windows-x64
        path: ${{ runner.temp }}\server-bin

    - name: Assemble package
      id: package
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $release = $false
        if ($env:GITHUB_REF -like 'refs/tags/v*') {
          $expected = "v$((Get-Content VERSION -Raw).Trim())"
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag $env:GITHUB_REF_NAME does not match VERSION (expected $expected)" }
          $release = $true
        }
        $version = ./tools/New-BlorgPackage.ps1 `
          -ServerExe (Join-Path $env:RUNNER_TEMP 'server-bin\server-rs.exe') `
          -OutDir package -Release:$release
        echo "version=$version" >> $env:GITHUB_OUTPUT
        Get-Content package\manifest.json

    # Stable name on purpose: the Windows test guest pulls this artifact by
    # name. The version lives in manifest.json, not in the artifact name.
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: blorg-package-windows-x64
        path: package/
        if-no-files-found: error

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $zip = "blorg-${{ steps.package.outputs.version }}-windows-x64.zip"
        Compress-Archive -Path package\* -DestinationPath $zip
        gh release create $env:GITHUB_REF_NAME $zip package\manifest.json --title "blorg $env:GITHUB_REF_NAME" --notes "Test-signed driver and server-rs, built together. See manifest.json for the exact commits."
        if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
