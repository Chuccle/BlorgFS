name: Agent remote build

# The KVM-host end of tools/agent/blorg. build.yml stays the one recipe for
# the package that ships (and guest-runtime.yml tests it); this workflow is
# only for the iteration loop on the self-hosted KVM host (label blorg-kvm,
# set up with ci/agent/host/setup-kvm-host.sh): an incremental build in the
# persistent build VM, then, for build-test, the guest runtime tests on that
# package, all on one machine. An agent dispatches it with
# `blorg ci remote --runner kvm`; see "Remote agents" in AGENTS.md.
#
# On pull requests that touch this tooling it runs the parts that need no
# secrets or special hardware: the Linux tier, and the build VM's script on
# a hosted Windows runner at the cheapest tier, without packaging.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'build, or build-test (also run the guest tests on the package)'
        type: choice
        options: [ build, build-test ]
        default: build-test
      tier:
        description: 'Invoke-BlorgChecks.ps1 tier'
        type: choice
        options: [ Build, Fast, Proof, All ]
        default: Fast
  # Changes to this tooling, or to what its driver check reads.
  pull_request:
    branches: [ master ]
    paths:
      - 'tools/agent/**'
      - 'ci/agent/**'
      - 'src/BlorgFS.vcxproj'
      - 'src/packages.config'
      - '.github/workflows/agent-remote.yml'

permissions:
  contents: read
  actions: read

jobs:
  # The Linux tier agents run locally: the driver compiled against the real
  # WDK headers with clang, schema pins, and server-rs when it is pinned
  # here. It reads its flags from BlorgFS.vcxproj, so a project change
  # re-runs it.
  linux-tier:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Linux tier (blorg check)
    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      run: echo "is_dependabot=${{ github.actor == 'dependabot[bot]' }}" >> "$GITHUB_OUTPUT"

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}

    - name: Cache blorg downloads and builds
      uses: actions/cache@v5
      with:
        path: ~/.cache/blorg
        key: blorg-linux-${{ hashFiles('src/packages.config') }}-${{ hashFiles('.gitmodules') }}

    - name: Run the Linux tier
      run: tools/agent/blorg check

  # Keeps ci/agent/build-vm/Invoke-GuestBuild.ps1 working without a KVM
  # host: the same script the build VM runs, on a hosted runner, at the
  # Build tier and without packaging. It uploads no package -- the package
  # comes from build.yml only.
  script-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    name: Build VM script (hosted check)
    timeout-minutes: 120
    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      shell: pwsh
      run: echo "is_dependabot=${{ github.actor == 'dependabot[bot]' }}" >> $env:GITHUB_OUTPUT

    - name: Checkout repository and submodules
      uses: actions/checkout@v6
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}
        submodules: recursive
        persist-credentials: false

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ./packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Run Invoke-GuestBuild.ps1 (Build tier, no package)
      shell: pwsh
      run: |
        powershell -NoProfile -ExecutionPolicy Bypass -File ci/agent/build-vm/Invoke-GuestBuild.ps1 `
          -Source . -Tier Build -NoPackage -OutDir agent-out
        exit $LASTEXITCODE

    - name: Summary
      if: always()
      shell: pwsh
      run: |
        if (Test-Path agent-out\build-summary.txt) {
          $text = Get-Content agent-out\build-summary.txt -Raw
          "## Build VM script (hosted check)`n`n``````n$text``````" >> $env:GITHUB_STEP_SUMMARY
          # Also as an annotation: agents behind an egress proxy often cannot
          # reach the blob storage artifacts and logs are served from, but
          # can read annotations through api.github.com (blorg ci results).
          "::notice title=blorg build-summary::$($text.Trim() -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')"
        }

  kvm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [ self-hosted, blorg-kvm ]
    name: Build VM + guest (KVM host)
    timeout-minutes: 240
    # One build VM and one test guest per host.
    concurrency:
      group: blorg-kvm-host
      cancel-in-progress: false
    steps:
    # The host is persistent, so nothing may stay on it: the token is not
    # written into .git/config, and a read-only token scoped to these
    # repositories (BLORG_KVM_READ_TOKEN) is preferred over GH_PAT.
    - name: Checkout repository and submodules
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.BLORG_KVM_READ_TOKEN || secrets.GH_PAT }}
        submodules: recursive
        persist-credentials: false

    - name: Build in the build VM
      run: tools/agent/blorg win build --tier "${{ inputs.tier }}"

    - name: Test in a fresh guest
      if: inputs.action == 'build-test'
      run: tools/agent/blorg win test

    - name: Summary
      if: always()
      run: |
        for f in out/win/build-summary.txt out/guest-results/verdict.txt; do
          [[ -f "$f" ]] || continue
          { echo "## $f"; echo; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Readable through api.github.com, unlike artifacts and logs.
          text="$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::notice title=blorg $(basename "$f" .txt)::$text"
        done

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: agent-kvm-results
        path: |
          out/win/build-summary.txt
          out/win/logs/
          out/guest-results/
        if-no-files-found: warn

    # Not blorg-package-windows-x64: that name means "built by build.yml",
    # the package that ships. This one is an iteration build.
    - name: Upload package
      if: always() && hashFiles('out/package/manifest.json') != ''
      uses: actions/upload-artifact@v7
      with:
        name: agent-package-windows-x64
        path: out/package/
