name: Exhaustive verification

# Split from build.yml deliberately.
#
# build.yml is the PR gate: compile every configuration and run the Fast
# tier -- crypto vectors, the fuzz corpus, and the sandbox suites. It has to
# stay quick enough that people actually wait for it.
#
# This workflow is everything whose cost is measured in minutes rather than
# seconds: bounded model checking, the systematic interleaving explorations,
# the threaded stress runs, and the full fuzz corpus. None of it is a good
# gate -- a CBMC regression or an exhausted schedule space is worth a
# nightly failure, not a blocked merge.
#
# The interleavings job and build.yml's sandbox step are deliberately
# complementary: the gate filters *SchedTest.* and *StressTest.* out, this
# runs exactly those. Change the filter in one and change it in the other,
# or verification silently stops happening.
#
# What is NOT here: the Perf tier. It needs a mounted BlorgFS volume and a
# reachable HTTP backend, neither of which a hosted runner has, so it stays
# a local/VM activity. See the performance section in README.md.

on:
  schedule:
    # 03:00 UTC daily, well clear of the Dependabot window.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  proofs:
    runs-on: windows-latest
    name: CBMC proofs
    timeout-minutes: 90

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache CBMC
        id: cache_cbmc
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\cbmc
          key: ${{ runner.os }}-cbmc-6.10

      - name: Install CBMC
        if: steps.cache_cbmc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/diffblue/cbmc/releases/download/cbmc-6.1.0/cbmc-6.1.0-win64.msi'
          $msi = Join-Path $env:RUNNER_TEMP 'cbmc.msi'
          Invoke-WebRequest -Uri $url -OutFile $msi
          # Extract rather than install: the harness only needs cbmc.exe on a
          # path it can be pointed at, and msiexec /a keeps this from touching
          # machine state the next job would inherit.
          $dest = Join-Path $env:RUNNER_TEMP 'cbmc'
          Start-Process msiexec -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dest`"") -Wait -NoNewWindow

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Run CBMC proof harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cbmc = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'cbmc') -Filter cbmc.exe -Recurse |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $cbmc) { throw "cbmc.exe not found after install" }

          & "$env:GITHUB_WORKSPACE\tools\Invoke-BlorgProofs.ps1" -CbmcPath $cbmc
          if ($LASTEXITCODE -ne 0) { throw "CBMC proofs failed with exit code $LASTEXITCODE" }

  interleavings:
    runs-on: windows-latest
    name: ${{ matrix.shard.name }}
    timeout-minutes: 30

    # Exactly what the PR gate excludes.
    #
    # build.yml runs the sandbox suites with
    # --gtest_filter=-*SchedTest.*:*StressTest.*, because those two are 546
    # of the 608 seconds the suites used to take and a single exhaustive
    # proof is 518 of them. They are verification runs rather than
    # regression tests: a proof that exhausts a schedule space is worth a
    # nightly failure, not a blocked merge.
    #
    # The filter here is that one inverted, so between the two workflows
    # nothing has stopped being checked -- it has stopped being checked on
    # every push. The two lock-granularity node-table proofs run the full
    # search, about 25 minutes for the revival proof and 3 for the pin
    # proof, so each is split between runners with KM_SCHED_SHARD and the
    # node-table shard runs the rest of the suite.
    #
    # Release only, at about half Debug's time per schedule. ASan, the
    # shim's pool guards and NT_ASSERT are live in it; Debug adds only the
    # CRT heap and iterator checks, which ASan covers.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: 'Revival proof 1/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '0/16' }
          - { name: 'Revival proof 2/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '1/16' }
          - { name: 'Revival proof 3/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '2/16' }
          - { name: 'Revival proof 4/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '3/16' }
          - { name: 'Revival proof 5/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '4/16' }
          - { name: 'Revival proof 6/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '5/16' }
          - { name: 'Revival proof 7/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '6/16' }
          - { name: 'Revival proof 8/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '7/16' }
          - { name: 'Revival proof 9/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '8/16' }
          - { name: 'Revival proof 10/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '9/16' }
          - { name: 'Revival proof 11/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '10/16' }
          - { name: 'Revival proof 12/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '11/16' }
          - { name: 'Revival proof 13/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '12/16' }
          - { name: 'Revival proof 14/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '13/16' }
          - { name: 'Revival proof 15/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '14/16' }
          - { name: 'Revival proof 16/16', project: NodeTableSandbox, filter: 'NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode', split: '15/16' }
          - { name: 'Pin proof 1/4', project: NodeTableSandbox, filter: 'NodeTableSchedTest.NoInterleavingRetiresAPinnedNode', split: '0/4' }
          - { name: 'Pin proof 2/4', project: NodeTableSandbox, filter: 'NodeTableSchedTest.NoInterleavingRetiresAPinnedNode', split: '1/4' }
          - { name: 'Pin proof 3/4', project: NodeTableSandbox, filter: 'NodeTableSchedTest.NoInterleavingRetiresAPinnedNode', split: '2/4' }
          - { name: 'Pin proof 4/4', project: NodeTableSandbox, filter: 'NodeTableSchedTest.NoInterleavingRetiresAPinnedNode', split: '3/4' }
          - name: Node table proofs
            project: NodeTableSandbox
            filter: '*SchedTest.*:*StressTest.*-NodeTableRevivalSchedTest.NoInterleavingFreesARevivedNode:NodeTableSchedTest.NoInterleavingRetiresAPinnedNode'
          - name: Dispatch proofs
            project: DispatchSandbox
            filter: '*SchedTest.*:*StressTest.*'
          - name: Socket proofs
            project: SocketSandbox
            filter: '*SchedTest.*:*StressTest.*'
          - name: Ordering mutants
            project: NodeTableSandbox
            mutants: 'NodeTableSchedTest.NoAtomicInterleavingRetiresAPinnedNode:NodeTableSchedTest.NoInterleavingRetiresAPinnedDirectory:NodeTableSchedTest.NoInterleavingStrandsAnIdleNode:NodeTableRevivalSchedTest.NoAtomicInterleavingFreesARevivedNode'
          - name: Full fuzz corpus
            project: ClientFuzz

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # Client.c includes the generated flatbuffer reader, so every suite
      # that compiles it needs the codegen build.yml does. Same steps, same
      # cache key: a flatcc build either workflow made serves both.
      - name: Get flatcc commit hash
        id: flatcc_hash
        shell: pwsh
        run: |
          $hash = git -C third_party/flatcc rev-parse HEAD
          echo "flatcc_hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache Flatcc build
        id: cache_flatcc
        uses: actions/cache@v5
        with:
          path: |
            third_party/flatcc/bin/Release
            third_party/flatcc/build/MSVC
          key: ${{ runner.os }}-flatcc-${{ steps.flatcc_hash.outputs.flatcc_hash }}

      - name: Install build tools
        if: steps.cache_flatcc.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Build flatcc compiler
        if: steps.cache_flatcc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path third_party\flatcc\build\MSVC | Out-Null
          Push-Location third_party\flatcc\build\MSVC
          try {
            cmake '-DCMAKE_POLICY_VERSION_MINIMUM=3.5' ..\..
            if ($LASTEXITCODE -ne 0) { throw "cmake configure failed with exit code $LASTEXITCODE" }

            cmake --build . --config Release
            if ($LASTEXITCODE -ne 0) { throw "cmake build failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Create generated flatbuffer files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path generated | Out-Null
          & third_party\flatcc\bin\Release\flatcc.exe -rv --common_reader -o generated third_party\schemas\metadata_flatbuffer.fbs
          if ($LASTEXITCODE -ne 0) { throw "flatcc codegen failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path generated\metadata_flatbuffer_reader.h)) { throw "flatcc did not produce the reader header" }

      - name: Build ${{ matrix.shard.project }}
        shell: pwsh
        run: |
          msbuild 'tests\sandbox\${{ matrix.shard.project }}.vcxproj' /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "${{ matrix.shard.project }} failed to build" }

      - name: Run interleaving proofs
        if: matrix.shard.filter
        shell: pwsh
        env:
          KM_SCHED_SHARD: ${{ matrix.shard.split }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = @('x64\Release', 'tests\sandbox\x64\Release') |
                  ForEach-Object { Join-Path $_ '${{ matrix.shard.project }}.exe' } |
                  Where-Object { Test-Path $_ } |
                  Select-Object -First 1
          if (-not $path) { throw "${{ matrix.shard.project }}.exe was not built" }

          # Every exploration asserts it finished under its schedule cap, so
          # a pass means its space was exhausted and no interleaving of
          # those threads can fail the invariant. The atomic-granularity
          # proofs, where every interlocked operation and unlocked shared
          # access is a scheduling point, run with partial-order reduction;
          # the lock-granularity proofs run the full search and check the
          # reduction against it.
          & $path '--gtest_filter=${{ matrix.shard.filter }}'
          if ($LASTEXITCODE -ne 0) { throw "interleaving proofs failed with exit code $LASTEXITCODE" }

      - name: Run ordering mutants
        if: matrix.shard.mutants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = @('x64\Release', 'tests\sandbox\x64\Release') |
                  ForEach-Object { Join-Path $_ '${{ matrix.shard.project }}.exe' } |
                  Where-Object { Test-Path $_ } |
                  Select-Object -First 1
          if (-not $path) { throw "${{ matrix.shard.project }}.exe was not built" }

          # The weak-memory proofs, once to list every ordering they reach in
          # driver code (KM_ORDER_SITES), then once per ordering with that one
          # weakened to relaxed or, for a fence, dropped (KM_ORDER_MUTANT). A
          # weakened ordering the proofs still pass with is one they do not
          # depend on: either the driver does not need it or no proof reaches
          # the execution that does. A run that fails, aborts or outlives its
          # timeout has caught the mutant.
          $filter = '--gtest_filter=${{ matrix.shard.mutants }}'
          $out = Join-Path $env:RUNNER_TEMP 'ordering.txt'

          $env:KM_ORDER_SITES = '1'
          & $path $filter | Tee-Object -FilePath $out | Out-Null
          if ($LASTEXITCODE -ne 0) { Get-Content $out; throw "the proofs failed with no ordering weakened" }
          Remove-Item Env:KM_ORDER_SITES

          $sites = @(Select-String -Path $out -Pattern '^\[ ordering \] site (\d+): (.+)$' |
                     ForEach-Object { $_.Matches[0] })
          if ($sites.Count -eq 0) { throw "the proofs reached no ordering in driver code" }

          $survivors = @()
          foreach ($site in $sites) {
            $env:KM_ORDER_MUTANT = $site.Groups[1].Value
            $run = Start-Process -FilePath $path -ArgumentList $filter -NoNewWindow -PassThru `
                     -RedirectStandardOutput $out -RedirectStandardError "$out.err"
            if (-not $run.WaitForExit(300000)) {
              $run.Kill()
              continue
            }
            if (0 -eq $run.ExitCode) { $survivors += $site.Groups[2].Value }
          }
          Remove-Item Env:KM_ORDER_MUTANT

          "$($sites.Count - $survivors.Count) of $($sites.Count) weakened orderings fail a proof"
          $survivors | ForEach-Object { "survived: $_" }
          if ($survivors.Count -ne 0) { throw "the proofs pass with $($survivors.Count) orderings weakened" }

      - name: Run the full fuzz corpus
        if: matrix.shard.project == 'ClientFuzz'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = @('x64\Release', 'tests\sandbox\x64\Release') |
                  ForEach-Object { Join-Path $_ 'ClientFuzz.exe' } |
                  Where-Object { Test-Path $_ } |
                  Select-Object -First 1
          if (-not $path) { throw "ClientFuzz.exe was not built" }

          # 50000 iterations, against the 200-iteration smoke the gate runs.
          & $path 50000
          if ($LASTEXITCODE -ne 0) { throw "ClientFuzz failed with exit code $LASTEXITCODE" }

