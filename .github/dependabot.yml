version: 2
registries:
  schemas:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.GH_DEPENDABOT_PAT}}


updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    registries:
      - schemas # Allow version updates for dependencies in this registry
    schedule:
      interval: "weekly"
    # The driver and the server must compile the same schema (the CI "Package
    # pins" job fails otherwise), so a schemas bump and the server-rs bump that
    # adopts it have to arrive as one PR, not two that are each red alone.
    groups:
      package-contract:
        patterns:
          - "third_party/schemas"
          - "third_party/server-rs"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
