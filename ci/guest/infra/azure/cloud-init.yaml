#cloud-config
# Turns a fresh Ubuntu VM into a BlorgFS guest host: the same packages and
# /dev/kvm access as ci/guest/host/install-host-deps.sh, which needs the
# repository and so cannot run here before it has been cloned.
package_update: true
packages:
  - qemu-system-x86
  - qemu-utils
  - xorriso
  - openssh-client
  - python3
  - curl
  - openssl
  - git
write_files:
  - path: /etc/udev/rules.d/99-blorgfs-kvm.rules
    content: |
      KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
runcmd:
  - udevadm control --reload-rules
  - udevadm trigger --name-match=kvm
  - test -e /dev/kvm && chmod 0666 /dev/kvm || echo "WARNING: no /dev/kvm -- this VM size has no nested virtualization" > /etc/motd
