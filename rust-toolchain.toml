# The Rust toolchain that builds the pinned server-rs, in CI, in
# tools/Containerfile and by hand: rustup picks it up anywhere under this
# checkout, third_party/server-rs included.
[toolchain]
channel = "1.99.0"
profile = "minimal"
components = ["clippy"]
targets = ["x86_64-unknown-linux-musl", "x86_64-pc-windows-gnu"]
